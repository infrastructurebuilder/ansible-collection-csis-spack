---
# A step of kind config: declare settings in a configuration scope. Every
# option comes from the step; an option the step does not give is left to the
# module's own default.

- name: "Declare settings | {{ spack_setup_title }}"
  infrastructurebuilder.csis_spack.spack_config:
    spack: "{{ spack_setup_executable }}"
    scope: "{{ spack_setup_step.scope | default(spack_setup_scope) }}"
    settings: "{{ spack_setup_step.settings }}"
    state: "{{ spack_setup_step.state | default(omit) }}"
    mode: "{{ spack_setup_step.mode | default(omit) }}"
  environment: "{{ spack_setup_step_environment }}"
  register: spack_setup_done
